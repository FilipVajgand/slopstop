<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slopstop</title>
  <style>
    :root {
      --bg:        #141417;
      --surface:   #1c1c20;
      --raised:    #24242a;
      --line:      #2e2e36;
      --ink:       #ececf1;
      --ink-dim:   #8b8b96;
      --ink-faint: #5c5c66;
      --accent:    #ff4444;
      --accent-bg: rgba(255, 68, 68, 0.14);
      --radius:    8px;
    }

    * { box-sizing: border-box; }

    body {
      width: 360px;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--ink);
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- masthead ---- */
    .masthead {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 14px;
    }
    .wordmark {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
      margin: 0;
    }
    .wordmark em {
      font-style: normal;
      color: var(--accent);
    }
    .tagline {
      color: var(--ink-faint);
      font-size: 11px;
      margin-left: auto;
    }

    /* ---- segmented tabs ---- */
    .segmented {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      padding: 2px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 12px;
    }
    .tab-btn {
      appearance: none;
      border: 0;
      border-radius: 6px;
      padding: 7px 4px;
      background: transparent;
      color: var(--ink-dim);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }
    .tab-btn:hover { background: var(--raised); color: var(--ink); }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* ---- entry row ---- */
    .entry {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    #input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      font: inherit;
    }
    #input::placeholder { color: var(--ink-faint); }
    #input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--raised);
    }
    #add {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 14px;
      background: var(--raised);
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }
    #add:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    #add:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* ---- list ---- */
    #list {
      list-style: none;
      margin: 0;
      padding: 0;
      height: 268px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    #list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
    }
    #list li:last-child { border-bottom: 0; }
    #list li > span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .delete-btn {
      flex: none;
      color: var(--ink-faint);
      cursor: pointer;
      padding: 1px 6px;
      border-radius: 5px;
      line-height: 1.4;
      transition: color 120ms ease, background 120ms ease;
    }
    .delete-btn:hover { color: var(--accent); background: var(--accent-bg); }

    #list::-webkit-scrollbar { width: 9px; }
    #list::-webkit-scrollbar-thumb {
      background: var(--raised);
      border-radius: 5px;
      border: 2px solid var(--surface);
    }
    #list::-webkit-scrollbar-thumb:hover { background: #33333c; }

    /* ---- footer ---- */
    .toolbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 12px;
    }
    .action-btn {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 7px 4px;
      background: var(--surface);
      color: var(--ink-dim);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }
    .action-btn:hover { background: var(--raised); color: var(--ink); }
    .action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .status-bar {
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
      color: var(--ink-faint);
      min-height: 15px;
    }
    .status-bar.is-ok    { color: #5ac47d; }
    .status-bar.is-warn  { color: #e0a458; }
    .status-bar.is-error { color: var(--accent); }

    /* ---- list states ---- */
    .list-note {
      justify-content: center;
      color: var(--ink-faint);
    }
    .list-note.is-error { color: var(--accent); }
    .list-more {
      justify-content: center;
      color: var(--ink-faint);
      font-style: italic;
    }

    /* ---- AI database summary ---- */
    .db-summary {
      display: block;
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 14px 10px;
      text-align: center;
      background: var(--raised);
    }
    .db-count {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.1;
    }
    .db-caption {
      margin-top: 3px;
      font-size: 10px;
      font-weight: 600;
      color: var(--ink-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .db-meta {
      margin-top: 5px;
      font-size: 10px;
      color: var(--ink-faint);
    }
  </style>
</head>
<body>
  <header class="masthead">
    <h1 class="wordmark">Slop<em>stop</em></h1>
    <span class="tagline">AI artist blocker</span>
  </header>

  <nav class="segmented">
    <button class="tab-btn active" data-tab="keywords">Keywords</button>
    <button class="tab-btn" data-tab="songs">Songs</button>
    <button class="tab-btn" data-tab="artists">Artists</button>
    <button class="tab-btn" data-tab="ai">AI DB</button>
  </nav>

  <div class="entry" id="input-area">
    <input type="text" id="input" placeholder="Add a keyword…" autocomplete="off" spellcheck="false">
    <button id="add">Add</button>
  </div>

  <ul id="list"></ul>

  <div class="toolbar">
    <button class="action-btn" id="btn-refresh">↻ Sync</button>
    <button class="action-btn" id="btn-export">↓ Export</button>
    <button class="action-btn" id="btn-import">↑ Import</button>
    <input type="file" id="file-input" accept=".json" hidden>
  </div>

  <p class="status-bar" id="status">Ready.</p>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
